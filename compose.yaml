services:
  lab:
    image: geleideng/simple-ctf:v1.0
    command: ["serve", "--data", "/data"]
    ports:
      - "127.0.0.1:${CTF_PORT:-8080}:8080"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - lab-data:/data
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
volumes:
  lab-data:
